apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: __SOURCE_STS__
  namespace: __TEST_NAMESPACE__
spec:
  serviceName: __SOURCE_STS__
  replicas: 1
  podManagementPolicy: Parallel
  updateStrategy:
    type: OnDelete
  selector:
    matchLabels:
      app: __SOURCE_STS__
  template:
    metadata:
      labels:
        app: __SOURCE_STS__
        repack-fix-test: source
      annotations:
        scheduling.volcano.sh/queue-name: __QUEUE_NAME__
    spec:
      schedulerName: __SCHEDULER_NAME__
      terminationGracePeriodSeconds: 90
      nodeSelector:
        __SOURCE_NODE_LABEL_KEY__: "__SOURCE_NODE_LABEL_VALUE__"
      containers:
        - name: worker
          image: __TEST_IMAGE__
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              trap 'exit 0' TERM INT
              while true; do sleep 5; done
          # 故意不再申请 huawei.com/ascend-1980。
          resources: {}
