apiVersion: repack.volcano.sh/v1alpha1
kind: RepackRun
metadata:
  name: __RUN_NAME__
spec:
  mode: Execute
  scope:
    podGroups:
      include:
        selector:
          matchLabels:
            repack-reuse-test: source
    nodes:
      include:
        names:
          - __SOURCE_NODE__
  goals:
    - resource: __TARGET_RESOURCE__
      minFragImprovementPercent: 0
  maxPerRun:
    podGroups: 1
    resources:
      __TARGET_RESOURCE__: "__SOURCE_POD_CARDS__"
  eviction:
    gracePeriodSeconds: 90

